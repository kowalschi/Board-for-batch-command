<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="Nine manual steps per job before the app, three steps with the app">
  <style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1d1a}.h{font-size:16px;font-weight:700}.r{font-size:13.5px}.n{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}.s{font-size:13px;fill:#5b564e}</style>
  <rect width="900" height="410" rx="12" fill="#f6f1e7"/>

  <text x="40" y="48" class="h">By hand, for every job</text>
  <g>
    <rect x="40" y="66" width="390" height="28" rx="4" fill="#fff" stroke="#b9b2a5"/><circle cx="58" cy="80" r="9" fill="#7a746a"/><text x="58" y="84" class="n">1</text><text x="76" y="85" class="r">Copy the job link and fix the path by hand</text>
    <rect x="40" y="100" width="390" height="28" rx="4" fill="#fff" stroke="#b9b2a5"/><circle cx="58" cy="114" r="9" fill="#7a746a"/><text x="58" y="118" class="n">2</text><text x="76" y="119" class="r">Open the folder, check that the files are there</text>
    <rect x="40" y="134" width="390" height="28" rx="4" fill="#fff" stroke="#b9b2a5"/><circle cx="58" cy="148" r="9" fill="#7a746a"/><text x="58" y="152" class="n">3</text><text x="76" y="153" class="r">Open each PDF to check the ink names</text>
    <rect x="40" y="168" width="390" height="28" rx="4" fill="#fff" stroke="#b9b2a5"/><circle cx="58" cy="182" r="9" fill="#7a746a"/><text x="58" y="186" class="n">4</text><text x="76" y="187" class="r">Copy the files to the workstation</text>
    <rect x="40" y="202" width="390" height="28" rx="4" fill="#fff" stroke="#b9b2a5"/><circle cx="58" cy="216" r="9" fill="#7a746a"/><text x="58" y="220" class="n">5</text><text x="76" y="221" class="r">Type a long command with the right options</text>
    <rect x="40" y="236" width="390" height="28" rx="4" fill="#fff" stroke="#b9b2a5"/><circle cx="58" cy="250" r="9" fill="#7a746a"/><text x="58" y="254" class="n">6</text><text x="76" y="255" class="r">Paste it in the console and press Enter</text>
    <rect x="40" y="270" width="390" height="28" rx="4" fill="#fff" stroke="#b9b2a5"/><circle cx="58" cy="284" r="9" fill="#7a746a"/><text x="58" y="288" class="n">7</text><text x="76" y="289" class="r">Keep checking the folder for the result</text>
    <rect x="40" y="304" width="390" height="28" rx="4" fill="#fff" stroke="#b9b2a5"/><circle cx="58" cy="318" r="9" fill="#7a746a"/><text x="58" y="322" class="n">8</text><text x="76" y="323" class="r">Copy the result back to the server</text>
    <rect x="40" y="338" width="390" height="28" rx="4" fill="#fff" stroke="#b9b2a5"/><circle cx="58" cy="352" r="9" fill="#7a746a"/><text x="58" y="356" class="n">9</text><text x="76" y="357" class="r">Note the job somewhere, in case it comes back</text>
  </g>

  <text x="480" y="48" class="h">With the app</text>
  <g>
    <rect x="480" y="66" width="380" height="44" rx="4" fill="#fff" stroke="#c8502a" stroke-width="2.5"/><circle cx="502" cy="88" r="11" fill="#c8502a"/><text x="502" y="92" class="n">1</text><text x="524" y="93" class="r" style="font-weight:700">Copy the job link</text>
    <rect x="480" y="120" width="380" height="44" rx="4" fill="#fff" stroke="#c8502a" stroke-width="2.5"/><circle cx="502" cy="142" r="11" fill="#c8502a"/><text x="502" y="146" class="n">2</text><text x="524" y="147" class="r" style="font-weight:700">Look at the alert box: green or red</text>
    <rect x="480" y="174" width="380" height="44" rx="4" fill="#fff" stroke="#c8502a" stroke-width="2.5"/><circle cx="502" cy="196" r="11" fill="#c8502a"/><text x="502" y="200" class="n">3</text><text x="524" y="201" class="r" style="font-weight:700">Click "Execute Command"</text>
  </g>
  <text x="480" y="252" class="s">The app does the rest, then plays a sound,</text>
  <text x="480" y="271" class="s">flashes in the taskbar and shows a message</text>
  <text x="480" y="290" class="s">when the result is back on the server.</text>
</svg>
